<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Web e infraestrutura</title>
  <desc id="d">Ilustração de uma janela de navegador ligada a um terminal Linux, representando as duas áreas de atuação: web e infraestrutura.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e8d9f2" fill-opacity=".08"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9d6bff" stop-opacity=".28"/><stop offset="1" stop-color="#9d6bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d6bff"/><stop offset="1" stop-color="#ffb7c5"/></linearGradient>
  </defs>
  <style>
    .flow{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-14}}
    .p1{animation:right 3s linear infinite}
    .p2{animation:left 3s linear 1.5s infinite}
    @keyframes right{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(150px);opacity:0}}
    @keyframes left{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(-150px);opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.flow,.p1,.p2,.cur{animation:none}}
  </style>
  <rect width="1000" height="240" rx="14" fill="#0b0710"/>
  <rect width="1000" height="240" rx="14" fill="url(#dots)"/>
  <ellipse cx="500" cy="120" rx="420" ry="110" fill="url(#glow)"/>

  <!-- navegador -->
  <rect x="60" y="32" width="340" height="176" rx="10" fill="#1a0f26" stroke="#2d1547" stroke-width="1.5"/>
  <path d="M60 60 V42 a10 10 0 0 1 10 -10 H390 a10 10 0 0 1 10 10 V60 Z" fill="#2d1547" fill-opacity=".7"/>
  <circle cx="78" cy="46" r="4" fill="#ffb7c5"/><circle cx="92" cy="46" r="4" fill="#9d6bff"/><circle cx="106" cy="46" r="4" fill="#e8d9f2" fill-opacity=".7"/>
  <rect x="126" y="39" width="200" height="14" rx="7" fill="#0b0710"/>
  <rect x="78" y="72" width="304" height="58" rx="8" fill="url(#gp)" fill-opacity=".5"/>
  <rect x="94" y="88" width="130" height="9" rx="4.5" fill="#fde7ee"/>
  <rect x="94" y="105" width="86" height="6" rx="3" fill="#fde7ee" fill-opacity=".6"/>
  <rect x="300" y="94" width="66" height="18" rx="9" fill="#0b0710" fill-opacity=".55"/>
  <rect x="78" y="142" width="94" height="52" rx="7" fill="#0b0710" stroke="#2d1547"/><rect x="88" y="152" width="50" height="6" rx="3" fill="#ffb7c5" fill-opacity=".85"/><rect x="88" y="165" width="70" height="5" rx="2.5" fill="#e8d9f2" fill-opacity=".4"/><rect x="88" y="176" width="40" height="5" rx="2.5" fill="#e8d9f2" fill-opacity=".4"/>
  <rect x="184" y="142" width="94" height="52" rx="7" fill="#0b0710" stroke="#2d1547"/><rect x="194" y="152" width="50" height="6" rx="3" fill="#9d6bff" fill-opacity=".9"/><rect x="194" y="165" width="70" height="5" rx="2.5" fill="#e8d9f2" fill-opacity=".4"/><rect x="194" y="176" width="40" height="5" rx="2.5" fill="#e8d9f2" fill-opacity=".4"/>
  <rect x="290" y="142" width="92" height="52" rx="7" fill="#0b0710" stroke="#2d1547"/><rect x="300" y="152" width="50" height="6" rx="3" fill="#ffb7c5" fill-opacity=".85"/><rect x="300" y="165" width="68" height="5" rx="2.5" fill="#e8d9f2" fill-opacity=".4"/><rect x="300" y="176" width="40" height="5" rx="2.5" fill="#e8d9f2" fill-opacity=".4"/>

  <!-- conexao -->
  <path class="flow" d="M404 120 H596" fill="none" stroke="#ffb7c5" stroke-opacity=".7" stroke-width="1.6"/>
  <g transform="translate(424 120)"><g class="p1"><circle r="3.6" fill="#ffb7c5"/></g></g>
  <g transform="translate(576 120)"><g class="p2"><circle r="3.6" fill="#9d6bff"/></g></g>
  <circle cx="500" cy="120" r="20" fill="#0b0710" stroke="#ffb7c5" stroke-width="1.5"/>
  <text x="500" y="124" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#fde7ee">HTTP</text>

  <!-- terminal -->
  <rect x="600" y="32" width="340" height="176" rx="10" fill="#0b0710" stroke="#9d6bff" stroke-opacity=".6" stroke-width="1.5"/>
  <path d="M600 60 V42 a10 10 0 0 1 10 -10 H930 a10 10 0 0 1 10 10 V60 Z" fill="#2d1547" fill-opacity=".7"/>
  <circle cx="618" cy="46" r="4" fill="#ffb7c5"/><circle cx="632" cy="46" r="4" fill="#9d6bff"/><circle cx="646" cy="46" r="4" fill="#e8d9f2" fill-opacity=".7"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#fde7ee">
    <text x="620" y="94"><tspan fill="#ffb7c5">$</tspan> docker compose up -d</text>
    <text x="620" y="122"><tspan fill="#ffb7c5">$</tspan> tailscale status</text>
    <text x="620" y="150"><tspan fill="#ffb7c5">$</tspan> ufw status</text>
    <text x="620" y="178"><tspan fill="#ffb7c5">$</tspan></text>
  </g>
  <rect class="cur" x="636" y="166" width="8" height="15" fill="#9d6bff"/>

  <rect x=".5" y=".5" width="999" height="239" rx="13.5" fill="none" stroke="#2d1547"/>
</svg>
