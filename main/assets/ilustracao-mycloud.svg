<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">My Cloud</title>
  <desc id="d">Ilustração de um notebook enviando arquivos para a nuvem, que também é acessada por um celular.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e8d9f2" fill-opacity=".08"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9d6bff" stop-opacity=".30"/><stop offset="1" stop-color="#9d6bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d6bff"/><stop offset="1" stop-color="#ffb7c5"/></linearGradient>
  </defs>
  <style>
    .flow{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-14}}
    .f1{animation:fly 4.5s linear infinite}
    .f2{animation:fly 4.5s linear 2.25s infinite}
    .f3{animation:fly3 3.2s linear infinite}
    @keyframes fly{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(220px);opacity:0}}
    @keyframes fly3{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(44px);opacity:0}}
    .bob{animation:bob 6s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @media (prefers-reduced-motion:reduce){.flow,.f1,.f2,.f3,.bob{animation:none}}
  </style>
  <rect width="1000" height="220" rx="14" fill="#0b0710"/>
  <rect width="1000" height="220" rx="14" fill="url(#dots)"/>
  <ellipse cx="520" cy="110" rx="400" ry="105" fill="url(#glow)"/>

  <!-- notebook -->
  <rect x="170" y="48" width="140" height="92" rx="7" fill="#1a0f26" stroke="#9d6bff" stroke-width="1.5"/>
  <rect x="178" y="56" width="124" height="76" rx="3" fill="#0b0710"/>
  <rect x="186" y="64" width="12" height="9" rx="2" fill="#ffb7c5"/><rect x="204" y="66" width="72" height="5" rx="2.5" fill="#e8d9f2" fill-opacity=".5"/>
  <rect x="186" y="80" width="12" height="9" rx="2" fill="#ffb7c5"/><rect x="204" y="82" width="56" height="5" rx="2.5" fill="#e8d9f2" fill-opacity=".5"/>
  <rect x="186" y="96" width="12" height="9" rx="2" fill="#9d6bff"/><rect x="204" y="98" width="82" height="5" rx="2.5" fill="#e8d9f2" fill-opacity=".35"/>
  <rect x="186" y="116" width="108" height="5" rx="2.5" fill="#2d1547"/><rect x="186" y="116" width="66" height="5" rx="2.5" fill="url(#gp)"/>
  <path d="M158 142 H322 L334 156 H146 Z" fill="#2d1547" stroke="#9d6bff" stroke-opacity=".6"/>
  <rect x="224" y="144" width="32" height="3" rx="1.5" fill="#0b0710" fill-opacity=".6"/>

  <!-- fluxo notebook -> nuvem -->
  <path class="flow" d="M322 100 H572" fill="none" stroke="#ffb7c5" stroke-opacity=".7" stroke-width="1.6"/>
  <g transform="translate(330 89)"><g class="f1"><path d="M0 0 H12 L18 6 V22 H0 Z" fill="#ffb7c5"/><path d="M12 0 V6 H18" fill="none" stroke="#0b0710" stroke-width="1.4"/></g></g>
  <g transform="translate(330 89)"><g class="f2"><path d="M0 0 H12 L18 6 V22 H0 Z" fill="#9d6bff"/><path d="M12 0 V6 H18" fill="none" stroke="#0b0710" stroke-width="1.4"/></g></g>

  <!-- nuvem -->
  <g class="bob">
    <path d="M610 150 a30 30 0 0 1 -4 -59 a46 46 0 0 1 86 -22 a38 38 0 0 1 62 30 a29 29 0 0 1 -6 51 Z" fill="#1a0f26" stroke="#ffb7c5" stroke-width="1.8"/>
    <rect x="668" y="106" width="26" height="22" rx="4" fill="#9d6bff"/>
    <path d="M673 106 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="#fde7ee" stroke-width="3" stroke-linecap="round"/>
    <circle cx="681" cy="116" r="3" fill="#0b0710"/><rect x="679.8" y="116" width="2.4" height="6" rx="1" fill="#0b0710"/>
  </g>

  <!-- fluxo nuvem -> celular -->
  <path class="flow" d="M764 100 H834" fill="none" stroke="#9d6bff" stroke-opacity=".8" stroke-width="1.6"/>
  <g transform="translate(772 89)"><g class="f3"><path d="M0 0 H12 L18 6 V22 H0 Z" fill="#e8d9f2"/><path d="M12 0 V6 H18" fill="none" stroke="#0b0710" stroke-width="1.4"/></g></g>

  <!-- celular -->
  <rect x="840" y="52" width="48" height="96" rx="9" fill="#1a0f26" stroke="#9d6bff" stroke-width="1.5"/>
  <rect x="845" y="62" width="38" height="76" rx="4" fill="#0b0710"/>
  <rect x="850" y="70" width="28" height="6" rx="3" fill="#ffb7c5" fill-opacity=".9"/>
  <rect x="850" y="82" width="22" height="6" rx="3" fill="#e8d9f2" fill-opacity=".5"/>
  <rect x="850" y="94" width="26" height="6" rx="3" fill="#e8d9f2" fill-opacity=".5"/>
  <rect x="850" y="106" width="18" height="6" rx="3" fill="#9d6bff" fill-opacity=".8"/>
  <rect x="857" y="142" width="14" height="2.5" rx="1.2" fill="#e8d9f2" fill-opacity=".4"/>

  <rect x=".5" y=".5" width="999" height="219" rx="13.5" fill="none" stroke="#2d1547"/>
</svg>
