<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Build, break, understand, improve</title>
  <desc id="d">Ciclo de quatro etapas: construir, quebrar, entender e melhorar, que se repete.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e8d9f2" fill-opacity=".08"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9d6bff" stop-opacity=".28"/><stop offset="1" stop-color="#9d6bff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .orbit{stroke-dasharray:7 9;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-16}}
    .node{animation:hot 8s ease-in-out infinite}
    .n2{animation-delay:2s}.n3{animation-delay:4s}.n4{animation-delay:6s}
    @keyframes hot{0%,20%,100%{stroke:#9d6bff;stroke-opacity:.65;fill:#1a0f26}6%,14%{stroke:#ffb7c5;stroke-opacity:1;fill:#2d1547}}
    @media (prefers-reduced-motion:reduce){.orbit,.node{animation:none}}
  </style>
  <rect width="1000" height="260" rx="14" fill="#0b0710"/>
  <rect width="1000" height="260" rx="14" fill="url(#dots)"/>
  <ellipse cx="500" cy="130" rx="420" ry="120" fill="url(#glow)"/>

  <ellipse class="orbit" cx="500" cy="130" rx="300" ry="80" fill="none" stroke="#9d6bff" stroke-opacity=".7" stroke-width="1.6"/>

  <!-- setas no sentido horario -->
  <g fill="#ffb7c5">
    <polygon points="-6,-5 6,0 -6,5" transform="translate(288 73) rotate(-15)"/>
    <polygon points="-6,-5 6,0 -6,5" transform="translate(712 73) rotate(15)"/>
    <polygon points="-6,-5 6,0 -6,5" transform="translate(712 187) rotate(165)"/>
    <polygon points="-6,-5 6,0 -6,5" transform="translate(288 187) rotate(195)"/>
  </g>

  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#fde7ee" text-anchor="middle">
    <rect class="node" x="135" y="110" width="130" height="40" rx="20" fill="#1a0f26" stroke="#9d6bff" stroke-width="1.6"/><text x="200" y="135.5">Build</text>
    <rect class="node n2" x="435" y="30" width="130" height="40" rx="20" fill="#1a0f26" stroke="#9d6bff" stroke-width="1.6"/><text x="500" y="55.5">Break</text>
    <rect class="node n3" x="735" y="110" width="130" height="40" rx="20" fill="#1a0f26" stroke="#9d6bff" stroke-width="1.6"/><text x="800" y="135.5">Understand</text>
    <rect class="node n4" x="435" y="190" width="130" height="40" rx="20" fill="#1a0f26" stroke="#9d6bff" stroke-width="1.6"/><text x="500" y="215.5">Improve</text>
  </g>

  <rect x=".5" y=".5" width="999" height="259" rx="13.5" fill="none" stroke="#2d1547"/>
</svg>
