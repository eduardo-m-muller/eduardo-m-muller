<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Helpdesk</title>
  <desc id="d">Ilustração de um painel de chamados com prioridades destacadas, ligando quem abre o chamado a quem faz o atendimento.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e8d9f2" fill-opacity=".08"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9d6bff" stop-opacity=".28"/><stop offset="1" stop-color="#9d6bff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .flow{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-14}}
    .t1{animation:go 3.2s linear infinite}
    .t2{animation:go 3.2s linear 1.6s infinite}
    @keyframes go{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(84px);opacity:0}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
    @media (prefers-reduced-motion:reduce){.flow,.t1,.t2,.pulse{animation:none}}
  </style>
  <rect width="1000" height="220" rx="14" fill="#0b0710"/>
  <rect width="1000" height="220" rx="14" fill="url(#dots)"/>
  <ellipse cx="500" cy="110" rx="380" ry="100" fill="url(#glow)"/>

  <!-- quem abre o chamado -->
  <circle cx="218" cy="88" r="20" fill="#e8d9f2" fill-opacity=".9"/>
  <path d="M184 150 a34 30 0 0 1 68 0 Z" fill="#e8d9f2" fill-opacity=".9"/>
  <path class="flow" d="M262 110 H334" fill="none" stroke="#ffb7c5" stroke-opacity=".75" stroke-width="1.6"/>
  <g transform="translate(262 102)"><g class="t1"><rect width="16" height="16" rx="4" fill="#ffb7c5"/><rect x="3.5" y="5" width="9" height="2" rx="1" fill="#0b0710"/><rect x="3.5" y="9" width="6" height="2" rx="1" fill="#0b0710"/></g></g>

  <!-- painel -->
  <rect x="340" y="30" width="320" height="160" rx="12" fill="#1a0f26" stroke="#2d1547"/>
  <path d="M340 56 V42 a12 12 0 0 1 12 -12 H648 a12 12 0 0 1 12 12 V56 Z" fill="#2d1547" fill-opacity=".7"/>
  <circle cx="358" cy="43" r="3.6" fill="#ffb7c5"/><circle cx="371" cy="43" r="3.6" fill="#9d6bff"/><circle cx="384" cy="43" r="3.6" fill="#e8d9f2" fill-opacity=".7"/>
  <rect x="540" y="39" width="100" height="8" rx="4" fill="#0b0710"/>

  <g class="pulse"><rect x="356" y="68" width="288" height="30" rx="7" fill="#ffb7c5" fill-opacity=".10" stroke="#ffb7c5" stroke-opacity=".55"/></g>
  <rect x="356" y="68" width="5" height="30" rx="2.5" fill="#ffb7c5"/>
  <rect x="374" y="79" width="140" height="8" rx="4" fill="#fde7ee" fill-opacity=".85"/>
  <rect x="580" y="76" width="52" height="14" rx="7" fill="#ffb7c5"/>

  <rect x="356" y="106" width="288" height="30" rx="7" fill="#9d6bff" fill-opacity=".08" stroke="#9d6bff" stroke-opacity=".35"/>
  <rect x="356" y="106" width="5" height="30" rx="2.5" fill="#9d6bff"/>
  <rect x="374" y="117" width="170" height="8" rx="4" fill="#e8d9f2" fill-opacity=".6"/>
  <rect x="580" y="114" width="52" height="14" rx="7" fill="#9d6bff"/>

  <rect x="356" y="144" width="288" height="30" rx="7" fill="#e8d9f2" fill-opacity=".04" stroke="#e8d9f2" stroke-opacity=".18"/>
  <rect x="356" y="144" width="5" height="30" rx="2.5" fill="#8b8194"/>
  <rect x="374" y="155" width="110" height="8" rx="4" fill="#e8d9f2" fill-opacity=".4"/>
  <rect x="580" y="152" width="52" height="14" rx="7" fill="#8b8194" fill-opacity=".8"/>

  <!-- quem faz o atendimento -->
  <path class="flow" d="M666 110 H738" fill="none" stroke="#9d6bff" stroke-opacity=".85" stroke-width="1.6"/>
  <g transform="translate(666 102)"><g class="t2"><rect width="16" height="16" rx="4" fill="#9d6bff"/><path d="M4 8.5 l3 3 l5.5 -6" fill="none" stroke="#fde7ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <circle cx="782" cy="88" r="20" fill="#e8d9f2" fill-opacity=".9"/>
  <path d="M748 150 a34 30 0 0 1 68 0 Z" fill="#e8d9f2" fill-opacity=".9"/>
  <path d="M760 86 a22 22 0 0 1 44 0" fill="none" stroke="#9d6bff" stroke-width="4" stroke-linecap="round"/>
  <rect x="755" y="84" width="8" height="14" rx="3" fill="#9d6bff"/><rect x="801" y="84" width="8" height="14" rx="3" fill="#9d6bff"/>
  <path d="M805 98 q0 10 -14 10" fill="none" stroke="#9d6bff" stroke-width="2.4" stroke-linecap="round"/>

  <rect x=".5" y=".5" width="999" height="219" rx="13.5" fill="none" stroke="#2d1547"/>
</svg>
