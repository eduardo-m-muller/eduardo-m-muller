<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Homelab</title>
  <desc id="d">Ilustração de um rack de servidores com LEDs piscando, um escudo de segurança e dispositivos conectados por acesso remoto.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e8d9f2" fill-opacity=".08"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9d6bff" stop-opacity=".30"/><stop offset="1" stop-color="#9d6bff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .flow{stroke-dasharray:5 7;animation:dash 1.5s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
    .led{animation:led 2.2s ease-in-out infinite}
    .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.2s}.d4{animation-delay:1.7s}
    @keyframes led{0%,100%{opacity:1}50%{opacity:.2}}
    .ring{transform-origin:240px 104px;animation:ring 3.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.35);opacity:0}}
    @media (prefers-reduced-motion:reduce){.flow,.led,.ring{animation:none}}
  </style>
  <rect width="1000" height="220" rx="14" fill="#0b0710"/>
  <rect width="1000" height="220" rx="14" fill="url(#dots)"/>
  <ellipse cx="500" cy="110" rx="390" ry="105" fill="url(#glow)"/>

  <!-- escudo -->
  <path class="ring" d="M240 56 L276 68 V104 C276 128 260 144 240 152 C220 144 204 128 204 104 V68 Z" fill="none" stroke="#ffb7c5" stroke-width="1.5"/>
  <path d="M240 56 L276 68 V104 C276 128 260 144 240 152 C220 144 204 128 204 104 V68 Z" fill="#1a0f26" stroke="#ffb7c5" stroke-width="1.8"/>
  <path d="M224 104 l12 12 l22 -24" fill="none" stroke="#fde7ee" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="flow" d="M286 110 H394" fill="none" stroke="#ffb7c5" stroke-opacity=".6" stroke-width="1.5"/>

  <!-- rack -->
  <rect x="396" y="24" width="208" height="172" rx="10" fill="#0b0710" stroke="#2d1547" stroke-width="1.5"/>
  <g>
    <rect x="408" y="36" width="184" height="40" rx="6" fill="#1a0f26" stroke="#9d6bff" stroke-opacity=".7"/>
    <circle class="led d1" cx="424" cy="56" r="3.4" fill="#ffb7c5"/><circle class="led d2" cx="437" cy="56" r="3.4" fill="#9d6bff"/><circle cx="450" cy="56" r="3.4" fill="#e8d9f2" fill-opacity=".5"/>
    <g stroke="#2d1547" stroke-width="3" stroke-linecap="round"><path d="M508 46 V66"/><path d="M520 46 V66"/><path d="M532 46 V66"/><path d="M544 46 V66"/><path d="M556 46 V66"/><path d="M568 46 V66"/><path d="M580 46 V66"/></g>
  </g>
  <g>
    <rect x="408" y="90" width="184" height="40" rx="6" fill="#1a0f26" stroke="#9d6bff" stroke-opacity=".7"/>
    <circle class="led d3" cx="424" cy="110" r="3.4" fill="#9d6bff"/><circle cx="437" cy="110" r="3.4" fill="#e8d9f2" fill-opacity=".5"/><circle class="led d1" cx="450" cy="110" r="3.4" fill="#ffb7c5"/>
    <rect x="474" y="104" width="70" height="12" rx="3" fill="#0b0710"/><rect x="480" y="108" width="40" height="4" rx="2" fill="#9d6bff" fill-opacity=".8"/>
  </g>
  <g>
    <rect x="408" y="144" width="184" height="40" rx="6" fill="#1a0f26" stroke="#9d6bff" stroke-opacity=".7"/>
    <circle cx="424" cy="164" r="3.4" fill="#e8d9f2" fill-opacity=".5"/><circle class="led d4" cx="437" cy="164" r="3.4" fill="#ffb7c5"/><circle class="led d2" cx="450" cy="164" r="3.4" fill="#9d6bff"/>
    <g stroke="#2d1547" stroke-width="3" stroke-linecap="round"><path d="M508 154 V174"/><path d="M520 154 V174"/><path d="M532 154 V174"/><path d="M544 154 V174"/><path d="M556 154 V174"/><path d="M568 154 V174"/><path d="M580 154 V174"/></g>
  </g>

  <!-- acesso remoto -->
  <g fill="none" stroke="#9d6bff" stroke-opacity=".8" stroke-width="1.5">
    <path class="flow" d="M608 110 L716 62"/><path class="flow" d="M608 110 L736 110"/><path class="flow" d="M608 110 L716 158"/>
  </g>
  <g>
    <rect x="716" y="40" width="52" height="34" rx="5" fill="#1a0f26" stroke="#ffb7c5" stroke-width="1.5"/><rect x="722" y="46" width="40" height="22" rx="2" fill="#0b0710"/><rect x="706" y="76" width="72" height="4" rx="2" fill="#2d1547"/>
    <rect x="736" y="92" width="48" height="36" rx="5" fill="#1a0f26" stroke="#9d6bff" stroke-width="1.5"/><rect x="742" y="98" width="36" height="24" rx="2" fill="#0b0710"/>
    <rect x="796" y="100" width="10" height="20" rx="2" fill="#2d1547" fill-opacity="0"/>
    <rect x="716" y="140" width="30" height="50" rx="6" fill="#1a0f26" stroke="#e8d9f2" stroke-opacity=".7" stroke-width="1.5"/><rect x="721" y="147" width="20" height="32" rx="2" fill="#0b0710"/>
  </g>

  <rect x=".5" y=".5" width="999" height="219" rx="13.5" fill="none" stroke="#2d1547"/>
</svg>
