<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">CloudNest</title>
  <desc id="d">Ilustração das telas de login e cadastro em tema escuro, com tons de vermelho e rosa e campos de vidro fosco.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e8d9f2" fill-opacity=".07"/></pattern>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e5486a"/><stop offset="1" stop-color="#ffb7c5"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="cp"><rect width="1000" height="220" rx="14"/></clipPath>
  </defs>
  <style>
    .cardA{animation:flo 7s ease-in-out infinite}
    .cardB{animation:flo 7s ease-in-out 1.6s infinite}
    @keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .drift{animation:drift 14s ease-in-out infinite alternate}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(26px,10px)}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.cardA,.cardB,.drift,.cur{animation:none}}
  </style>
  <rect width="1000" height="220" rx="14" fill="#0b0710"/>
  <rect width="1000" height="220" rx="14" fill="url(#dots)"/>
  <g clip-path="url(#cp)"><g filter="url(#blur)">
    <g class="drift"><circle cx="330" cy="70" r="62" fill="#e5486a" fill-opacity=".6"/></g>
    <circle cx="640" cy="160" r="70" fill="#ffb7c5" fill-opacity=".45"/>
    <circle cx="520" cy="40" r="46" fill="#9d6bff" fill-opacity=".4"/>
  </g></g>

  <!-- login -->
  <g class="cardA">
    <rect x="286" y="26" width="204" height="168" rx="16" fill="#fde7ee" fill-opacity=".07" stroke="#ffb7c5" stroke-opacity=".4"/>
    <circle cx="388" cy="52" r="9" fill="url(#gr)"/>
    <rect x="348" y="68" width="80" height="7" rx="3.5" fill="#fde7ee" fill-opacity=".85"/>
    <rect x="306" y="88" width="164" height="26" rx="8" fill="#fde7ee" fill-opacity=".08" stroke="#fde7ee" stroke-opacity=".25"/>
    <rect x="318" y="98.5" width="54" height="5" rx="2.5" fill="#fde7ee" fill-opacity=".4"/>
    <rect class="cur" x="378" y="96" width="1.6" height="12" fill="#ffb7c5"/>
    <rect x="306" y="122" width="164" height="26" rx="8" fill="#fde7ee" fill-opacity=".08" stroke="#fde7ee" stroke-opacity=".25"/>
    <g fill="#fde7ee" fill-opacity=".65"><circle cx="321" cy="135" r="2.6"/><circle cx="335" cy="135" r="2.6"/><circle cx="349" cy="135" r="2.6"/><circle cx="363" cy="135" r="2.6"/><circle cx="377" cy="135" r="2.6"/></g>
    <rect x="306" y="160" width="164" height="24" rx="12" fill="url(#gr)"/>
    <rect x="364" y="169" width="48" height="6" rx="3" fill="#0b0710" fill-opacity=".7"/>
  </g>

  <!-- cadastro -->
  <g class="cardB">
    <rect x="510" y="26" width="204" height="168" rx="16" fill="#fde7ee" fill-opacity=".07" stroke="#ffb7c5" stroke-opacity=".4"/>
    <circle cx="612" cy="46" r="8" fill="url(#gr)"/>
    <rect x="572" y="60" width="80" height="6" rx="3" fill="#fde7ee" fill-opacity=".85"/>
    <rect x="530" y="76" width="164" height="22" rx="7" fill="#fde7ee" fill-opacity=".08" stroke="#fde7ee" stroke-opacity=".25"/>
    <rect x="542" y="85" width="44" height="4.5" rx="2.2" fill="#fde7ee" fill-opacity=".4"/>
    <rect x="530" y="104" width="164" height="22" rx="7" fill="#fde7ee" fill-opacity=".08" stroke="#fde7ee" stroke-opacity=".25"/>
    <rect x="542" y="113" width="70" height="4.5" rx="2.2" fill="#fde7ee" fill-opacity=".4"/>
    <rect x="530" y="132" width="164" height="22" rx="7" fill="#fde7ee" fill-opacity=".08" stroke="#fde7ee" stroke-opacity=".25"/>
    <g fill="#fde7ee" fill-opacity=".65"><circle cx="544" cy="143" r="2.4"/><circle cx="557" cy="143" r="2.4"/><circle cx="570" cy="143" r="2.4"/><circle cx="583" cy="143" r="2.4"/></g>
    <rect x="530" y="162" width="164" height="24" rx="12" fill="url(#gr)"/>
    <rect x="588" y="171" width="48" height="6" rx="3" fill="#0b0710" fill-opacity=".7"/>
  </g>

  <rect x=".5" y=".5" width="999" height="219" rx="13.5" fill="none" stroke="#2d1547"/>
</svg>
